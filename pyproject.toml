[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admcms-mcp"
version = "0.1.0"
description = "ADMCMS remote MCP server with Entra SSO"
requires-python = ">=3.12"
dependencies = [
    # Upper bounds are deliberate: mcp 2.0 removed `mcp.server.fastmcp`, so an
    # unbounded range builds an image that crashes on import. Every dependency
    # here is capped below its next major for the same reason.
    "mcp[cli]>=1.28.1,<2",
    "pyodbc>=5.1.0,<6",
    "authlib>=1.3.0,<2",
    "starlette>=0.37.0,<2",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.6.0,<3",
    "pydantic-settings>=2.2.0,<3",
    "azure-identity>=1.16.0,<2",
    "azure-keyvault-secrets>=4.8.0,<5",
    # Audit store; the local SQLite file does not survive a restart.
    "azure-data-tables>=12.5.0,<13",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    # Exact gepind: ruff formatteert ook Python-codeblokken in Markdown, en dat
    # gedrag verandert tussen patch-versies. Ongepind installeerde CI 0.16.5
    # terwijl een ontwikkelaar 0.16.4 had, en dan faalt de format-check op iets
    # dat lokaal groen was. Een formatter hoort reproduceerbaar te zijn.
    "ruff==0.16.5",
    "pip-audit>=2.7.0",
    "cryptography>=50.0",  # <50 has CVE-2026-69247 (HIGH)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The connector icon; without this the wheel omits it and /icon.png 404s.
admcms_mcp = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# server.py deliberately calls load_dotenv() before importing the modules that
# read configuration at import time; the imports cannot move above it.
"src/admcms_mcp/server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/admcms_mcp"]
omit = ["*/tests/*"]
